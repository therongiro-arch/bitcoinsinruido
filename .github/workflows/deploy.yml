name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'workers/**'
      - 'posts/**'
      - 'hilos/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'workers/**'
      - 'posts/**'
      - 'hilos/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python (for OG image generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Open Graph images
        run: |
          pip install --quiet pillow
          python generate_og.py

      - name: Build site
        run: npm run build
        env:
          PUBLIC_NEWS_API_URL: https://news.bitcoinsinruidos.com/feed.json

      - name: Prepare deploy metadata
        id: meta
        env:
          RAW_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}
          BRANCH_RAW: ${{ github.head_ref || github.ref_name }}
        run: |
          # Pick only the subject line, strip control chars, cap at 100 chars.
          subject=$(printf '%s' "$RAW_MSG" | head -n1 | tr -d '\r' | tr -cd '\11\12\15\40-\176' | cut -c1-100)
          if [ -z "$subject" ]; then subject="deploy ${GITHUB_SHA::7}"; fi
          # Branch: keep only safe chars.
          branch=$(printf '%s' "$BRANCH_RAW" | tr -cd '[:alnum:]/_.-' | cut -c1-60)
          if [ -z "$branch" ]; then branch=main; fi
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bitcoinsinruido --branch=${{ steps.meta.outputs.branch }} --commit-hash=${{ github.sha }} --commit-message="${{ steps.meta.outputs.subject }}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.deployment-url }}";
            if (!url) return;
            const body = `🚀 Preview desplegado: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find((c) => c.user.type === "Bot" && c.body.startsWith("🚀 Preview"));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
