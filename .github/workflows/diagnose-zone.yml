name: Diagnose Cloudflare zone

on:
  workflow_dispatch:

jobs:
  diagnose-zone:
    runs-on: ubuntu-latest
    steps:
      - name: Direct probes to specific anycast IPs (no API needed)
        run: |
          set +e
          echo "=== EU anycast IPs (188.114.96.5 / 97.5) ==="
          for IP in 188.114.96.5 188.114.97.5; do
            echo "--- $IP ---"
            curl -sI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              --resolve "bitcoinsinruidos.com:443:$IP" \
              --connect-timeout 15 \
              "https://bitcoinsinruidos.com/" 2>&1 | head -15
            echo ""
          done

          echo ""
          echo "=== US anycast IPs (172.67.169.241 / 104.21.63.48) ==="
          for IP in 172.67.169.241 104.21.63.48; do
            echo "--- $IP ---"
            curl -sI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              --resolve "bitcoinsinruidos.com:443:$IP" \
              --connect-timeout 15 \
              "https://bitcoinsinruidos.com/" 2>&1 | head -15
            echo ""
          done

          echo ""
          echo "=== Test via Cloudflare WARP (Spain location) ==="
          # Get a body sample to see if there's a challenge page
          curl -s --max-time 15 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --resolve "bitcoinsinruidos.com:443:188.114.96.5" \
            "https://bitcoinsinruidos.com/" 2>&1 | head -50

      - name: Inspect WAF rules and zone security (needs Zone:Read)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          ZONE_ID=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=bitcoinsinruidos.com" \
            | jq -r '.result[0].id // "NONE"')
          echo "Zone ID: $ZONE_ID"

          echo ""
          echo "=== Token permissions check ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq .

          echo ""
          echo "=== Firewall rules ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/firewall/rules" | jq .

          echo ""
          echo "=== WAF custom rules ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets/phases/http_request_firewall_custom/entrypoint" | jq .

          echo ""
          echo "=== Zone security settings ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings" | jq '.result[]? | select(.id | test("security|ssl|tls|under|challenge|waf|http"))' | head -100
