name: Diagnose Cloudflare Pages domain

# One-off diagnostic to probe bitcoinsinruidos.com from GitHub's IPs
# (which Cloudflare won't filter) and inspect the Pages project state via
# the CF API. Triggered manually with workflow_dispatch.
#
# Safe to delete once the issue is resolved.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public URLs
        run: |
          echo "=== Apex domain (custom) ==="
          curl -sI -o /dev/null -w "HTTPS %{http_code} en %{time_total}s | redirect=%{redirect_url}\n" --connect-timeout 15 https://bitcoinsinruidos.com/ || echo "TIMEOUT/CONNECTION FAILED"
          curl -sI -o /dev/null -w "HTTP  %{http_code} en %{time_total}s | redirect=%{redirect_url}\n" --connect-timeout 15 http://bitcoinsinruidos.com/  || echo "TIMEOUT/CONNECTION FAILED"

          echo ""
          echo "=== www subdomain ==="
          curl -sI -o /dev/null -w "HTTPS %{http_code} en %{time_total}s\n" --connect-timeout 15 https://www.bitcoinsinruidos.com/ || echo "TIMEOUT/CONNECTION FAILED"

          echo ""
          echo "=== Pages URL (project canonical) ==="
          curl -sI -o /dev/null -w "HTTPS %{http_code} en %{time_total}s\n" --connect-timeout 15 https://bitcoinsinruido.pages.dev/ || echo "TIMEOUT/CONNECTION FAILED"

          echo ""
          echo "=== DNS resolution ==="
          dig +short bitcoinsinruidos.com
          dig +short bitcoinsinruidos.com NS @1.1.1.1
          dig +short CNAME bitcoinsinruidos.com @1.1.1.1
          dig +short A bitcoinsinruidos.com @1.1.1.1

          echo ""
          echo "=== TLS handshake on apex ==="
          timeout 10 openssl s_client -connect bitcoinsinruidos.com:443 -servername bitcoinsinruidos.com </dev/null 2>&1 | head -30 || echo "TLS HANDSHAKE FAILED"

      - name: Inspect Pages project via CF API
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "=== Pages project ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/bitcoinsinruido" \
            | python3 -m json.tool | head -80

          echo ""
          echo "=== Custom domains ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/bitcoinsinruido/domains" \
            | python3 -m json.tool

          echo ""
          echo "=== Latest deployment ==="
          curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/bitcoinsinruido/deployments?per_page=1" \
            | python3 -m json.tool | head -60
