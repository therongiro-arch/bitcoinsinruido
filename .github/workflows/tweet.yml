name: Generar contenido Bitcoin Sin Ruido

on:
  schedule:
    - cron: '0 10 * * *'  # Cada dia a las 10:00 UTC (12:00 Espana / 05:00 CDMX)
  workflow_dispatch:       # Lanzar manualmente desde GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy python-dotenv pillow

      - name: Generate tweet content
        run: python post_tweet.py --generate-only

      - name: Upload tweet content
        uses: actions/upload-artifact@v4
        with:
          name: tweet-del-dia-${{ github.run_number }}
          path: |
            tweet_card.png
            tweet_content.txt
          retention-days: 7

      - name: Save queue state
        uses: actions/upload-artifact@v4
        with:
          name: tweet-queue
          path: tweet_queue.json
          if-no-files-found: ignore
          retention-days: 30
