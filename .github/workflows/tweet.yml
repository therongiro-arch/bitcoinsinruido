name: Auto-publish Bitcoin tweet

on:
  schedule:
    - cron: '0 10 * * *'  # Cada día a las 10:00 UTC (12:00 España / 05:00 CDMX)
  workflow_dispatch:       # También permite lanzarlo manualmente desde GitHub

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy python-dotenv pillow

      - name: Publish tweet
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: python post_tweet.py

      - name: Save queue state
        uses: actions/upload-artifact@v4
        with:
          name: tweet-queue
          path: tweet_queue.json
          if-no-files-found: ignore
