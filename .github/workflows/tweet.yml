name: Bitcoin Sin Ruido - Contenido automatico

on:
  schedule:
    - cron: '0 10 * * *'      # Diario 10:00 UTC - tweet individual
    - cron: '0 9 * * 1'       # Lunes 09:00 UTC - hilo semanal
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de contenido'
        required: true
        default: 'tweet'
        type: choice
        options:
          - tweet
          - hilo

permissions:
  contents: write   # archivar el contenido generado en posts/ y hilos/

jobs:
  tweet-diario:
    name: Tweet diario
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tipo == 'tweet')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy python-dotenv pillow

      - name: Generate tweet content
        run: python post_tweet.py --generate-only

      - name: Upload tweet content
        uses: actions/upload-artifact@v4
        with:
          name: tweet-del-dia-${{ github.run_number }}
          path: |
            tweet_card.png
            tweet_content.txt
          retention-days: 7

      - name: Save queue state
        uses: actions/upload-artifact@v4
        with:
          name: tweet-queue
          path: tweet_queue.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Archive to posts/
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          DEST="posts/${DATE}-tweet-${RUN}"
          mkdir -p "$DEST"
          [ -f tweet_card.png ] && cp tweet_card.png "$DEST/card.png" || true
          [ -f tweet_content.txt ] && cp tweet_content.txt "$DEST/content.txt" || true
          if [ -z "$(ls -A "$DEST" 2>/dev/null)" ]; then
            echo "Nothing to archive — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "archive(tweet): ${DATE} run #${RUN}"
            # Reintentar push una vez si la rama avanza mientras commitamos
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

  hilo-semanal:
    name: Hilo semanal (lunes)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tipo == 'hilo')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tweepy python-dotenv pillow

      - name: Generate weekly thread
        run: python generate_thread.py

      - name: Upload thread content
        uses: actions/upload-artifact@v4
        with:
          name: hilo-semanal-${{ github.run_number }}
          path: |
            thread_card.png
            thread_content.txt
          retention-days: 14

      - name: Archive to hilos/
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          DEST="hilos/${DATE}-hilo-${RUN}"
          mkdir -p "$DEST"
          [ -f thread_card.png ] && cp thread_card.png "$DEST/card.png" || true
          [ -f thread_content.txt ] && cp thread_content.txt "$DEST/content.txt" || true
          if [ -z "$(ls -A "$DEST" 2>/dev/null)" ]; then
            echo "Nothing to archive — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "archive(hilo): ${DATE} run #${RUN}"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
