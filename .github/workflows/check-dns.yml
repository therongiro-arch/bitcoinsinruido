name: Check DNS authoritative records

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Multi-resolver DNS check
        run: |
          set +e
          for D in bitcoinsinruidos.com www.bitcoinsinruidos.com; do
            echo ""
            echo "============ $D ============"
            for NS in 1.1.1.1 8.8.8.8 9.9.9.9 208.67.222.222 ns1.cloudflare.com; do
              echo "  via $NS:"
              dig +short A "$D" @"$NS" | sed 's/^/    /'
            done
            echo ""
            echo "  Authoritative (CF auth servers):"
            dig +short NS "$D" | head -2 | while read auth; do
              echo "    via $auth:"
              dig +short A "$D" @"$auth" | sed 's/^/      /'
            done
          done

          echo ""
          echo "============ TTL ============"
          dig bitcoinsinruidos.com @1.1.1.1 | grep -E "^bitcoinsinruidos" | head -3
